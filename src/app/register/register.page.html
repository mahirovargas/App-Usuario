<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Foto de perfil -->
  <div style="text-align: center; margin-bottom: 20px;">
    <img
      *ngIf="fotoPerfil"
      [src]="fotoPerfil"
      style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--ion-color-primary);"
    />
    <ion-icon
      *ngIf="!fotoPerfil"
      name="person-circle-outline"
      style="font-size: 120px; color: var(--ion-color-medium);">
    </ion-icon>
    <br/>
    <ion-button fill="outline" (click)="tomarFoto()" class="ion-margin-top">
      <ion-icon slot="start" name="camera-outline"></ion-icon>
      {{ fotoPerfil ? 'Cambiar foto' : 'Tomar foto' }}
    </ion-button>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="registrarse()">

    <!-- Nombre -->
    <ion-item>
      <ion-label position="floating">Nombre completo</ion-label>
      <ion-input type="text" formControlName="nombre"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched">
      <small>Mínimo 3 caracteres</small>
    </ion-text>

    <!-- Correo -->
    <ion-item class="ion-margin-top">
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
      <small>Ingresa un correo válido</small>
    </ion-text>

    <!-- Contraseña -->
    <ion-item class="ion-margin-top">
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
      <small>Mínimo 6 caracteres</small>
    </ion-text>

    <!-- Teléfono -->
    <ion-item class="ion-margin-top">
      <ion-label position="floating">Teléfono (10 dígitos)</ion-label>
      <ion-input type="tel" formControlName="telefono"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="registerForm.get('telefono')?.invalid && registerForm.get('telefono')?.touched">
      <small>Ingresa un teléfono válido de 10 dígitos</small>
    </ion-text>

    <!-- Error general -->
    <ion-text color="danger" class="ion-margin-top" *ngIf="errorMensaje">
      <p>{{ errorMensaje }}</p>
    </ion-text>

    <!-- Botón registrar -->
    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="registerForm.invalid || cargando">
      <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
      <span *ngIf="!cargando">Registrarse</span>
    </ion-button>

    <!-- Ir al login -->
    <ion-button expand="block" fill="clear" (click)="irAValidacion()"
class="ion-margin-top">
  ¿Ya tienes cuenta? Inicia sesión
</ion-button>
  </form>

</ion-content>
